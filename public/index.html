<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrase Generator 7000</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
		
        <img src="images/cartoonMessLive_phraseGenerator7000_color.png" style="width:100%;">
		
        <div style="height:15px;"></div>
        <div id="message-container"></div>

        <form action="/submit" method="POST">
            <div class="form-group">
                <img src="images/word1_green.png" width="90">
                <input type="text" id="word1" name="word1" placeholder="Enter a word... maybe a descriptor?" maxlength="20" required>
            </div>
            <div class="form-group">
                <img src="images/word2_green.png" width="90">
                <input type="text" id="word2" name="word2" placeholder="Enter another word..." maxlength="20"  required>
            </div>
            <div class="form-group">
                <img src="images/password_green.png" width="90">
                <input type="text" id="showPassword" name="showPassword" placeholder="Enter password" required>
            </div>
            <button type="submit">Submit Words!</button>
        </form>
    </div>

    <script>
        // Check for message in URL (e.g., from a traditional redirect)
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        if (msg) {
            showMessage(msg);
            // Clear the message from URL without reloading
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function showMessage(text) {
            const container = document.getElementById('message-container');
            container.innerHTML = '';
            const alert = document.createElement('div');
            alert.className = 'alert alert-success';
            alert.textContent = text;
            container.appendChild(alert);

            // Fade out after 2 seconds
            setTimeout(() => {
                alert.classList.add('alert-fade');
                // Remove from DOM after transition completes
                setTimeout(() => {
                    alert.remove();
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
